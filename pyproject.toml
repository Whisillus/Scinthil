[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scinthil"
version = "0.0.0"
description = "Python helpers for Scinthil CUDA kernels."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "apache-tvm-ffi",
]

[project.optional-dependencies]
dev = [
  "mypy",
  "pre-commit",
  "ruff",
]

[tool.setuptools.packages.find]
include = ["scinthil*"]
exclude = [".*", "3rdparty*", "build*", "cmake-build-*", "dist*"]

[tool.setuptools.package-data]
scinthil = ["cuda/*.cuh", "cuda/*/*.cu", "cuda/*/*.cuh"]

[tool.ruff]
target-version = "py310"
line-length = 120
exclude = [
  ".*",
  "**/.*",
  "3rdparty",
  "build",
  "cmake-build-*",
  "dist",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.mypy]
python_version = "3.10"
files = ["scinthil"]
exclude = "^(3rdparty|build|dist|cmake-build-.*|\\.artamir)/"
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["tvm_ffi", "tvm_ffi.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["cutlass", "cutlass.*"]
ignore_missing_imports = true
